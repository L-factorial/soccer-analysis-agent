name: Backend container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKEND_IMAGE: soccer-analysis-backend:ci
      SOCCER_ENV_FILE: ./backend/.env.example
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build backend image
        run: |
          docker build --pull --tag "$BACKEND_IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" backend

      - name: Test deployment rollback
        run: python3 -m unittest discover -s deploy/tests

      - name: Run tests inside the image
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/backend/tests,target=/app/tests,readonly" \
            "$BACKEND_IMAGE" python -m unittest discover -s /app/tests

      - name: Validate Compose and start backend
        run: |
          docker compose config --quiet
          docker compose up --no-build --wait --wait-timeout 90
          curl --fail --silent --show-error http://127.0.0.1:8000/health

      - name: Publish tested image to GitHub Container Registry
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$BACKEND_IMAGE" "$image:$GITHUB_SHA"
          docker tag "$BACKEND_IMAGE" "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
          digest=$(docker image inspect "$image:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          printf 'digest=%s\n' "${digest##*@}" >> "$GITHUB_OUTPUT"

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Clean up
        if: always()
        run: |
          docker compose down
          docker logout ghcr.io

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy tested image
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DROPLET_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "root@$DROPLET_HOST" "deploy $IMAGE_DIGEST"

      - name: Check public HTTPS endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --max-time 15 https://api.soccer-agent.lfactorial.com/health

      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
